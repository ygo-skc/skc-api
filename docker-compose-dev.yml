services:
  skc-api:
    image: "eclipse-temurin:25.0.5.1_2-jre-ubi10-minimal"
    ports:
      - "4450:8450"
    user: "1000:1000"
    read_only: true
    volumes:
      - ./build/libs/skc-api.jar:/skc-api.jar:ro
    tmpfs:
      - /tmp:size=32m,mode=1777,exec # Netty
    command: java -jar skc-api.jar
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8450"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: "0.5"
          pids: 256
    memswap_limit: 400M
    networks:
      - skc
    environment:
      - SSL_KEYSTORE_PASSWORD=${SSL_KEYSTORE_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - SPRING_PROFILES_ACTIVE=docker,dev
      - SKC_SUGGESTION_ENGINE_API_KEY=${SKC_SUGGESTION_ENGINE_API_KEY}
      - >-
        JDK_JAVA_OPTIONS=-XX:MaxRAMPercentage=50
        -XX:InitialRAMPercentage=50
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=100
        -XX:+UseCompactObjectHeaders
        -XX:+UseStringDeduplication
        -XX:MaxDirectMemorySize=64m
        -XX:+ExitOnOutOfMemoryError
        -XX:+PerfDisableSharedMem
        -Dio.netty.allocator.maxOrder=6
    labels:
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"host":"%%host%%", "port": "%%port%%"}]'
      com.datadoghq.ad.logs: >-
        [{
          "source": "java",
          "service": "skc-api",
          "auto_multi_line_detection": true,
          "log_processing_rules": [{
            "type": "exclude_at_match",
            "name": "exclude_health_check",
            "pattern" : "/api/v1/status"
          }]
        }]
      com.datadoghq.tags.env: 'dev'
      com.datadoghq.tags.service: 'skc-api'

networks:
  skc:
    name: skc
    driver: bridge
    external: true # network was already created, if you need to recreate the network - make this false
